{% extends "base.html" %}
{% block content %}
<h2 class="mb-4 text-success">🎓 Student Dashboard</h2>
<div class="row">
  {% for teacher in teachers %}
  <div class="col-md-4 mb-4">
    <div class="card shadow-lg h-100 border-0">
      <div class="card-body text-center">
        <div class="mb-3">
          <i class="bi bi-person-circle" style="font-size:2rem; color:#00adb5;"></i>
        </div>
        <h5 class="card-title fw-bold">{{ teacher.name }}</h5>
        <p class="text-muted">Teacher Profile</p>
        <a href="{{ url_for('teacher_profile', teacher_id=teacher.id) }}" class="btn btn-custom w-100">View Lectures</a>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
