{% extends "base.html" %}
{% block content %}
<h2 class="mb-4 text-primary">{{ teacher.name }}'s Lectures</h2>

<div class="list-group">
  {% for lecture in lectures %}
  <div class="list-group-item shadow-sm mb-3 rounded">
    <h5 class="fw-bold text-custom">{{ lecture.title }} ({{ lecture.subject }})</h5>
    {% if lecture.file_path %}
    <!-- Show audio player + download only if file exists -->
    <div class="mt-3 d-flex align-items-center justify-content-between">
      <audio controls class="w-75">
        <source src="{{ url_for('uploaded_file', filename=lecture.file_path) }}" type="audio/mpeg">
        <source src="{{ url_for('uploaded_file', filename=lecture.file_path) }}" type="audio/wav">
        Your browser does not support the audio element.
      </audio>
      <a href="{{ url_for('uploaded_file', filename=lecture.file_path) }}" download class="btn btn-outline-primary ms-3">
        <i class="bi bi-download"></i>
      </a>
    </div>
    {% endif %}

    <p><strong>Notes:</strong> {{ lecture.summary }}
      <a href="{{ url_for('download_notes', lecture_id=lecture.id) }}" 
         class="btn btn-sm btn-outline-primary ms-2">
        <i class="bi bi-download"></i>
      </a>
    </p>
  </div>
{% endfor %}
</div>

<!-- Single Back button -->
<div class="text-end mt-4">
  <a href="{{ url_for('student_dashboard') }}" class="btn btn-outline-secondary back-btn">
    ⬅ Back
  </a>
</div>
{% endblock %}
